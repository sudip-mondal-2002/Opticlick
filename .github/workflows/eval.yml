name: LLM Eval — LangSmith (Gemma 4)

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Which cases to run: non-auth | all | easy | medium | hard'
        required: false
        default: 'non-auth'
      threshold:
        description: 'Minimum pass rate 0-100'
        required: false
        default: '70'
      langsmith_project:
        description: 'LangSmith project name to log results into'
        required: false
        default: 'opticlick-evals'

jobs:
  eval:
    name: Run LangSmith Evals
    runs-on: ubuntu-latest
    # Hard cap — prevents a hung test from blocking the runner indefinitely
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        # actions/setup-node v4.3.0 — pinned to immutable commit SHA
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg + ffprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Copy icons (required before build)
        run: npm run copy-icons

      - name: Build extension
        run: npm run build

      - name: Run eval suite
        env:
          # ── Phase 1: required ──────────────────────────────────────────────
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ inputs.langsmith_project }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVAL_FILTER: ${{ inputs.filter }}
          EVAL_THRESHOLD: ${{ inputs.threshold }}
          # ── Phase 2: auth secrets ──────────────────────────────────────────
          # Shared credentials used across all platforms (same email/password)
          EVAL_BOT_EMAIL: ${{ secrets.EVAL_BOT_EMAIL }}
          EVAL_BOT_PASSWORD: ${{ secrets.EVAL_BOT_PASSWORD }}
          # Username for platforms that use username instead of email (GitHub, Reddit)
          EVAL_BOT_USERNAME: ${{ secrets.EVAL_BOT_USERNAME }}
          # ── Fallback: base64-encoded storageState (bypasses UI logins) ─────
          STORAGE_STATE_BASE64: ${{ secrets.STORAGE_STATE_BASE64 }}
        # xvfb-run provides a virtual display — required since extensions need headless:false
        run: |
          xvfb-run --auto-servernum -- npm run eval:auth-setup
          xvfb-run --auto-servernum -- npm run eval:smoke-test
          xvfb-run --auto-servernum -- npm run eval

      - name: Upload eval artifacts
        if: always()
        # actions/upload-artifact v4.6.2 — pinned to immutable commit SHA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eval-results-${{ github.run_id }}
          path: evals/results/
          retention-days: 14
