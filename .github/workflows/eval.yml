name: LLM Eval — LangSmith (Gemma 4)

on:
  workflow_dispatch:
    inputs:
      auth_filter:
        description: 'Auth required: non-auth | auth | all'
        required: false
        default: 'non-auth'
      difficulty:
        description: 'Difficulty level: all | easy | medium | hard'
        required: false
        default: 'all'
      threshold:
        description: 'Minimum pass rate 0-100'
        required: false
        default: '70'
      langsmith_project:
        description: 'LangSmith project name to log results into'
        required: false
        default: 'opticlick-evals'
      dataset_name:
        description: 'LangSmith dataset name to run evals against'
        required: false
        default: 'Opticlick Eval Test Cases'
      dataset_id:
        description: 'LangSmith dataset UUID (pinned to the Opticlick benchmark)'
        required: false
        default: 'cda8e734-406a-449b-8513-7e828481ced1'
      experiment_name:
        description: 'Experiment name prefix shown in LangSmith (auto-suffixed with timestamp)'
        required: false
        default: 'opticlick-eval'
      max_concurrency:
        description: 'Parallel browser cases (1-6)'
        required: false
        default: '3'
      case_timeout_seconds:
        description: 'Per-case hard timeout in seconds'
        required: false
        default: '480'

jobs:
  eval:
    name: Run LangSmith Evals
    runs-on: ubuntu-latest
    # Hard cap — prevents a hung test from blocking the runner indefinitely
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        # actions/setup-node v4.3.0 — pinned to immutable commit SHA
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Copy icons (required before build)
        run: npm run copy-icons

      - name: Build extension
        run: npm run build

      - name: Run eval suite
        env:
          # ── Phase 1: required ──────────────────────────────────────────────
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ inputs.langsmith_project }}
          LANGSMITH_DATASET_NAME: ${{ inputs.dataset_name }}
          LANGSMITH_DATASET_ID: ${{ inputs.dataset_id }}
          EVAL_EXPERIMENT_NAME: ${{ inputs.experiment_name }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVAL_AUTH_FILTER: ${{ inputs.auth_filter }}
          EVAL_DIFFICULTY: ${{ inputs.difficulty }}
          EVAL_THRESHOLD: ${{ inputs.threshold }}
          EVAL_MAX_CONCURRENCY: ${{ inputs.max_concurrency }}
          EVAL_CASE_TIMEOUT_SECONDS: ${{ inputs.case_timeout_seconds }}
          # Isolated test-account state for auth runs; no UI login is attempted.
          STORAGE_STATE_BASE64: ${{ secrets.STORAGE_STATE_BASE64 }}
        # xvfb-run provides a virtual display — required since extensions need headless:false
        run: |
          xvfb-run --auto-servernum -- npm run eval:auth-setup
          xvfb-run --auto-servernum -- npm run eval:smoke-test
          xvfb-run --auto-servernum -- npm run eval

      - name: Publish GitHub eval summary
        if: always()
        env:
          LANGSMITH_DATASET_ID: ${{ inputs.dataset_id }}
          LANGSMITH_DATASET_NAME: ${{ inputs.dataset_name }}
        run: npm run eval:report

      - name: Upload eval artifacts
        # Authenticated recordings can contain private account data. Detailed
        # auth results belong in access-controlled LangSmith traces only.
        if: ${{ always() && inputs.auth_filter == 'non-auth' }}
        # actions/upload-artifact v4.6.2 — pinned to immutable commit SHA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eval-results-${{ github.run_id }}
          path: evals/results/summary.json
          retention-days: 14
