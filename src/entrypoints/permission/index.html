<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Microphone Access Required</title>
  <style>
    :root {
      --bg: #fafafa;
      --text: #171717;
      --card-bg: #ffffff;
      --border: #e5e5e5;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --muted: #737373;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --text: #f5f5f5;
        --card-bg: #141414;
        --border: #262626;
        --accent: #38bdf8;
        --accent-hover: #7dd3fc;
        --muted: #a3a3a3;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
    }
    .icon-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: rgba(2, 132, 199, 0.1);
      color: var(--accent);
      margin-bottom: 1.5rem;
    }
    @media (prefers-color-scheme: dark) {
      .icon-container {
        background-color: rgba(56, 189, 248, 0.1);
      }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.75rem 1.5rem;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 550;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    @media (prefers-color-scheme: dark) {
      .button {
        color: #000000;
      }
    }
    .button:hover {
      background-color: var(--accent-hover);
    }
    .button:active {
      transform: scale(0.98);
    }
    .status {
      margin-top: 1rem;
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      font-size: 0.8rem;
      color: var(--accent);
      min-height: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
        <line x1="12" x2="12" y1="19" y2="22" />
      </svg>
    </div>
    <h1>Microphone Access Required</h1>
    <p>Opticlick needs microphone access to transcribe your voice dictation. Please click the button below and select <strong>Allow</strong> when prompted by your browser.</p>
    <button id="request-btn" class="button">Enable Microphone</button>
    <div id="status-text" class="status" aria-live="polite" role="status" aria-atomic="true"></div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
